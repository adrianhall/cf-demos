packages:
  - 'cf-terraform-demos/*'
  - 'packages/*'
  - 'vinext-demos/*'
allowBuilds:
  workerd: true
  esbuild: true
  # Pulled in transitively by `agents` (through `@babel/plugin-proposal-decorators`, which backs
  # the SDK's optional `@callable` Vite transform). Its install script only prints a funding
  # notice, and no demo imports it, so it is denied rather than allowed.
  core-js-pure: false
# Security pins for transitive dev tooling (Ignite CRM Phase 7 review, SEC-002/SEC-003). Neither
# package reaches a deployed bundle: sharp comes through miniflare/@vercel/og, and shell-quote
# through npm-run-all2. Remove a pin once its parent depends on the patched version itself.
overrides:
  sharp: 0.35.5
  shell-quote@<1.11.0: 1.12.0
